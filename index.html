function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts), now = new Date();
  const hh = d.getHours().toString().padStart(2,'0');
  const mm = d.getMinutes().toString().padStart(2,'0');
  return d.toDateString() === now.toDateString()
    ? hh + ':' + mm
    : `${d.getMonth()+1}/${d.getDate()} ${hh}:${mm}`;
}

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>');
}

// 한국어 조사 선택 (받침 있으면 batchim, 없으면 noBatchim)
function josa(word, batchim, noBatchim) {
  if (!word) return batchim;
  const code = word.charCodeAt(word.length - 1);
  // 한글 완성형 범위: 0xAC00 ~ 0xD7A3, 받침 여부: (code - 0xAC00) % 28 !== 0
  if (code >= 0xAC00 && code <= 0xD7A3) {
    return (code - 0xAC00) % 28 !== 0 ? batchim : noBatchim;
  }
  return batchim; // 한글 아닌 경우 기본값
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer); // 이전 타이머 제거
  toastTimer = setTimeout(() => {
    t.classList.remove('show');
    toastTimer = null;
  }, 2800);
}

// 상단 바 방 사진/이름 업데이트
// roomInfo.roomName이 roomCode 폴백이 아닌 실제 이름일 때만 덮어씀
// → info 없는 기존 방은 HTML 하드코딩 타이틀 유지
function updateTopBar() {
  const hasRealName = roomInfo.roomName && roomInfo.roomName !== roomCode;
  const photo = roomInfo.photoData || '';
  const imgEl = document.querySelector('.top-bar .top-left img');
  const titleEl = document.querySelector('.top-bar .board-title');

  // 방 사진 업데이트
  if (imgEl && photo) imgEl.src = photo;

  // 상단 바 방 이름: 실제 이름 있을 때만 덮어씀 (없으면 HTML 하드코딩 유지)
  if (titleEl && hasRealName) titleEl.textContent = roomInfo.roomName;

  // 탭 제목 + 홈 바로가기 이름: 현재 표시 중인 board-title 텍스트 사용
  // (roomCode가 아니라 화면에 보이는 실제 이름으로)
  // shownName 결정 순서:
  // 1) roomInfo에 실제 이름 있으면 사용 (Firebase info 로드 완료)
  // 2) titleEl에 텍스트 있으면 사용 (이전 방 업데이트 값)
  // 3) 최후 폴백 '가족 공유판' (meta는 사용하지 않음 - 오염 방지)
  const shownName = hasRealName
    ? roomInfo.roomName
    : (titleEl?.textContent?.trim() || '가족 공유판');

  // 시간표 제목은 항상 고정
  const schedTitle = document.querySelector('.schedule-title');
  if (schedTitle) schedTitle.textContent = '📚 주간 학원 일정표';

  // 탭 제목 업데이트
  document.title = shownName;

  // apple-mobile-web-app-title 업데이트 (홈 바로가기 이름)
  const appTitleMeta = document.querySelector("meta[name='apple-mobile-web-app-title']");
  if (appTitleMeta) appTitleMeta.content = shownName;

  // 파비콘 + apple-touch-icon 업데이트
  // base64 data URL → Blob URL 변환 (브라우저가 파비콘으로 인식하려면 Blob URL 필요)
  setFavicon(photo || '');

  // manifest 동적 교체 (홈 바로가기 이름/아이콘)
  updateManifest(shownName, photo);
}

// base64 → Blob URL 변환 후 파비콘/touch-icon 교체
let _faviconBlobUrl = '';
function setFavicon(photoDataOrUrl) {
  try {
    const apply = (url) => {
      // apple-touch-icon 교체 (태그 재생성으로 캐시 무효화)
      const oldTouch = document.querySelector("link[rel='apple-touch-icon']");
      const newTouch = document.createElement('link');
      newTouch.rel = 'apple-touch-icon';
      newTouch.href = url;
      if (oldTouch) oldTouch.replaceWith(newTouch);
      else document.head.appendChild(newTouch);
      // favicon 교체
      const oldFav = document.querySelector("link[rel='icon']");
      const newFav = document.createElement('link');
      newFav.rel = 'icon';
      newFav.type = 'image/jpeg';
      newFav.href = url;
      if (oldFav) oldFav.replaceWith(newFav);
      else document.head.appendChild(newFav);
    };

    if (!photoDataOrUrl) {
      apply('app-icon.svg');
      return;
    }

    if (photoDataOrUrl.startsWith('data:')) {
      // base64 → Blob URL 변환
      const [header, b64] = photoDataOrUrl.split(',');
      const mime = header.match(/:(.*?);/)[1];
      const bytes = atob(b64);
      const arr = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
      const blob = new Blob([arr], { type: mime });
      // 이전 Blob URL 해제
      if (_faviconBlobUrl) URL.revokeObjectURL(_faviconBlobUrl);
      _faviconBlobUrl = URL.createObjectURL(blob);
      apply(_faviconBlobUrl);
    } else {
      apply(photoDataOrUrl);
    }
  } catch(e) {
    console.log('파비콘 업데이트 오류:', e);
  }
}

function updateManifest(name, iconDataUrl) {
  try {
    // iOS Safari는 manifest 내 Blob URL 아이콘을 읽지 못함
    // → base64 data URL을 manifest JSON에 직접 embed
    // → 방 사진 없으면 shrfamily.jpg URL 사용
    let iconEntry;
    if (iconDataUrl && iconDataUrl.startsWith('data:')) {
      // base64 그대로 embed (iOS Safari가 manifest JSON 내 base64는 지원함)
      const mime = iconDataUrl.split(';')[0].split(':')[1] || 'image/jpeg';
      iconEntry = [{ src: iconDataUrl, sizes: '192x192', type: mime }];
    } else {
      // 방 사진 없는 경우 → 절대 URL 사용
      const base = location.origin + location.pathname.replace(/\/[^/]*$/, '/');
      iconEntry = [{ src: base + 'app-icon.svg', sizes: '512x512', type: 'image/svg+xml' }];
    }
    const manifest = {
      name: name,
      short_name: name,
      start_url: location.pathname + '#' + roomHash,
      display: 'standalone',
      background_color: '#F6F4EF',
      theme_color: '#3D6B4F',
      icons: iconEntry
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    let link = document.querySelector("link[rel='manifest']");
    if (!link) {
      link = document.createElement('link');
      link.rel = 'manifest';
      document.head.appendChild(link);
    }
    // 이전 blob URL 해제
    if (link._blobUrl) URL.revokeObjectURL(link._blobUrl);
    link._blobUrl = url;
    link.href = url;
  } catch(e) {
    console.log('manifest 업데이트 오류:', e);
  }
}

// 자동 로그인
// URL #hash 있으면 → Firebase에서 roomCode 조회 → 입장
// 없으면 → localStorage 기준으로 입장
// ?guide=1 파라미터 있으면 → 자동 로그인 건너뜀 (가이드에서 링크로 진입 시)
(async () => {
  // 가이드 등 외부에서 ?guide=1로 진입하면 자동로그인 안 함
  if (location.search.includes('guide=1')) {
    showLanding();
    return;
  }
  const urlHash = getUrlHash();
  const sName  = localStorage.getItem('fb_name');
  const sColor = localStorage.getItem('fb_color');

  if (urlHash) {
    // URL hash로 방 조회
    try {
      const hashSnap = await new Promise(res =>
        onValue(ref(db, `roomHashes/${urlHash}`), res, { onlyOnce: true })
      );
      const code = hashSnap.val();
      if (code && sName && sColor) {
        // hash + 사용자 정보 모두 있음 → 자동 로그인
        myName = sName;
        myColor = sColor;
        roomCode = code;
        roomHash = urlHash;
        try {
          const sRoomInfo = localStorage.getItem('fb_roomInfo_' + urlHash);
          roomInfo = sRoomInfo ? JSON.parse(sRoomInfo) : { roomName: '', photoData: '' };
        } catch (_) {
          roomInfo = { roomName: '', photoData: '' };
        }
        enterBoard();
        return;
      }
    } catch (_) {}
    // hash는 있지만 사용자 정보 없음 → 참여 화면으로 (hash 유지)
    showLanding();
    return;
  }

  // URL hash 없음 → localStorage 기준 자동 로그인
  const sRoom = localStorage.getItem('fb_room');
  const sHash = localStorage.getItem('fb_hash');
  if (sName && sColor && sRoom) {
    myName = sName; myColor = sColor; roomCode = sRoom; roomHash = sHash || '';
    if (roomHash) setUrlHash(roomHash); // URL에 hash 복원
    try {
      const key = sHash || sRoom;
      const sRoomInfo = localStorage.getItem('fb_roomInfo_' + key);
      roomInfo = sRoomInfo ? JSON.parse(sRoomInfo) : { roomName: '', photoData: '' };
    } catch (_) {
      roomInfo = { roomName: '', photoData: '' };
    }
    enterBoard();
  } else {
    showLanding();
  }
})();
